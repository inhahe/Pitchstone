org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The app's version, major.minor.patch (CLAUDE.md says when to raise which), and its
# versionCode, which is major*10000 + minor*100 + patch: raise both together. The build
# refuses them if they disagree. F-Droid reads the code from here, where it can find it
# without running the build. release.bat tags a release v<appVersion>.
appVersion=1.0.2
appVersionCode=10002
