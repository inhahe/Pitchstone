<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Pitchstone editor</title>
    <link rel="stylesheet" href="prosemirror.css" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body data-mode="edit">
    <div id="app">
      <textarea id="title" rows="1" placeholder="Title" aria-label="Title" autocapitalize="sentences"></textarea>
      <div id="editor"></div>
      <textarea id="source" hidden spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Markdown source"></textarea>
      <div id="below" aria-hidden="true"></div>
    </div>
    <script src="editor.js"></script>
  </body>
</html>
